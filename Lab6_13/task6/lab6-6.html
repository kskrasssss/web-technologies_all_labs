<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Попап</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="popup-wrap">
        <input type="checkbox" id="popup-toggle" class="popup-toggle">
        <label for="popup-toggle" class="popup-button">
            <span class="material-icons">apps</span> Іконки
        </label>

        <div class="popup">
            <div class="popup-content" tabindex="0">
                <div class="icon-grid">
                    <button class="popup-item" title="Головна"><span class="material-icons">home</span></button>
                    <button class="popup-item" title="Пошук"><span class="material-icons">search</span></button>
                    <button class="popup-item" title="Пошта"><span class="material-icons">mail</span></button>
                    <button class="popup-item" title="Календар"><span class="material-icons">event</span></button>
                    <button class="popup-item" title="Фото"><span class="material-icons">photo</span></button>
                    <button class="popup-item" title="Музика"><span class="material-icons">music_note</span></button>
                    <button class="popup-item" title="Карти"><span class="material-icons">map</span></button>
                    <button class="popup-item" title="Налаштування"><span class="material-icons">settings</span></button>
                </div>

                <input type="checkbox" id="more-toggle" class="more-toggle">
                <label for="more-toggle" class="more-button">More</label>

                <div class="icon-grid icon-grid--extra">
                    <button class="popup-item" title="Відео"><span class="material-icons">videocam</span></button>
                    <button class="popup-item" title="Документи"><span class="material-icons">description</span></button>
                    <button class="popup-item" title="Завантаження"><span class="material-icons">download</span></button>
                    <button class="popup-item" title="Чат"><span class="material-icons">chat</span></button>
                    <button class="popup-item" title="Кошик"><span class="material-icons">shopping_cart</span></button>
                    <button class="popup-item" title="Профіль"><span class="material-icons">person</span></button>
                    <button class="popup-item" title="Допомога"><span class="material-icons">help</span></button>
                    <button class="popup-item" title="Обране"><span class="material-icons">favorite</span></button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
