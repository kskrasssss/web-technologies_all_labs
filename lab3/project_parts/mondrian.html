<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 2: Мондріан</title>
  <style>
    body { text-align: center; }
    table { margin: 20px auto; border-collapse: collapse; }
    td { border: 6px solid #000000; width: 80px; height: 70px; padding: 0; }
    .w { background: #ffffff; }
    .y { background: #fffa69; }
    .r { background: #ff5b2d; }
    .b { background: #074481; }
    .k { background: #000000; }
  </style>
</head>
<body>
  <table>
    <tr>
      <td class="w" colspan="2"></td>
      <td class="w"></td>
      <td class="y" colspan="2"></td>
    </tr>
    <tr>
      <td class="w"></td>
      <td class="r" colspan="2" rowspan="2"></td>
      <td class="y" colspan="2"></td>
    </tr>
    <tr>
      <td class="w" rowspan="2"></td>
      <td class="w"></td>
      <td class="w"></td>
    </tr>
    <tr>
      <td class="k" rowspan="2"></td>
      <td class="w"></td>
      <td class="w" colspan="2"></td>
    </tr>
    <tr>
      <td class="y" rowspan="3"></td>
      <td class="w"></td>
      <td class="b" colspan="2" rowspan="2"></td>
    </tr>
    <tr>
      <td class="w" rowspan="2"></td>
      <td class="k"></td>
    </tr>
    <tr>
      <td class="w" colspan="3"></td>
    </tr>
  </table>
  <p><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
