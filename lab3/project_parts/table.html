<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 1: таблиця</title>
  <style>
    body { text-align: center; }
    table { margin: 20px auto; border-collapse: collapse; border: 2px solid #000; }
    td { border: 2px solid #000; width: 45px; height: 45px; }
    .t { background: #33ffd1; }  /* бірюзовий */
    .c { background: #fffbd0; }  /* кремовий */
  </style>
</head>
<body>
  <table>
    <tr><td class="t" colspan="8"></td></tr>
    <tr>
      <td class="c" rowspan="6"></td>
      <td class="t" colspan="6"></td>
      <td class="c" rowspan="6"></td>
    </tr>
    <tr>
      <td class="c" rowspan="4"></td>
      <td class="t" colspan="4"></td>
      <td class="c" rowspan="4"></td>
    </tr>
    <tr>
      <td class="c" rowspan="2"></td>
      <td style="background: red;"></td>
      <td style="background: blue;"></td>
      <td class="c" rowspan="2"></td>
    </tr>
    <tr>
      <td style="background: lime;"></td>
      <td style="background: yellow;"></td>
    </tr>
    <tr><td class="t" colspan="4"></td></tr>
    <tr><td class="t" colspan="6"></td></tr>
    <tr><td class="t" colspan="8"></td></tr>
  </table>
  <p><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
